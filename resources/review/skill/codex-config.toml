# Codex's half of the review, for comparing agents on the same pull request.
#
# Bitbucket merges base config, then this file, then config.overrides, then its own
# enforced settings - later wins - so the pipeline YAML deliberately sets none of
# these: anything it set would win over this file and there would be no point
# editing it.
#
# Keep this file small. The first version turned the sandbox down to
# workspace-write with no network and the run answered "The terminal is unavailable
# here" - an agent that could not read the repository it was sent to review. The
# runtime Bitbucket ships decides what is reachable; this file should ask it for as
# little as possible.

# No model and no effort here: as with Claude Code, Codex picks its own default,
# which moves with the CLI. A team sets either under Review defaults (Codex's
# model and effort, a tier such as "smartest" among them), and prepare-review.sh
# writes it in, because Bitbucket substitutes no variables inside an agent's config
# block. The run's log says which model and effort Codex ended up with, and the
# review's page keeps the model it reported.
#
# On effort, for whoever sets one: across runs of one branch, low filed the same
# HIGH finding as medium and high, a missing scope check on an authenticated route,
# at a quarter of the cost and a third of the wall clock ($0.36 against $1.54, 90s
# against 389s). That was measured through the Codex CLI on a branch with no pull
# request, no previous findings and no ticket: a colder and easier read than a
# follow-up review.
#
# "Model metadata for <model> not found" is Codex's own table being older than the
# model, not the API refusing it. The fallback it defaults to is a guess at the
# context window. Clearing it with model_catalog_json was tried and dropped: the
# catalogue is Codex's undocumented internal struct, measured against codex-cli
# 0.157.0, and one missing field makes Codex refuse to start ("failed to parse
# model_catalog_json"). The warning wins. Not model_context_window either:
# openai/codex#16068 reports it breaks auto-compaction after the first overflow.

# Codex loads AGENTS.md by itself and CLAUDE.md only when told to. A repository
# with a CLAUDE.md and no AGENTS.md - one where Boost was set up for Claude alone,
# or a Magento or Drupal project with its own CLAUDE.md - otherwise reaches the
# reviewer only because SKILL.md names it. With this, Codex reads it the way
# Claude does. AGENTS.md still wins where both exist.
project_doc_fallback_filenames = ["CLAUDE.md"]

# Nothing else about the runtime. No sandbox_mode, no network_access, no
# approval_policy: the defaults are what the Bitbucket runtime is set up to work
# with, and every one of those keys in the first version was part of why the agent
# had no shell.
