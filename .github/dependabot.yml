version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      composer:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      npm-docs:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/cloudflare/worker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      npm-cloudflare-worker:
        patterns:
          - "*"
