name: release

# A tag named after the day, 2026.11.19 (2026.11.19.1 for a second that day),
# on main releases that version: the checks run on it, a GitHub Release is made
# with notes GitHub writes from the pull requests merged since the last release
# (grouped as .github/release.yml says), and the `stable` branch is moved to it.
# Forge deploys `stable`, so pushing the tag is the whole release.

on:
  push:
    tags:
      - '20[0-9][0-9].[0-9]*.[0-9]*'

permissions:
  contents: read

# One release at a time, never two moving `stable` at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/tests.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout the tag, with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Tag a commit that is merged."
            exit 1
          fi

      - name: Check the release's name
        run: |
          # Year, month and day without leading zeros, and a count for a second release that day.
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^20[0-9]{2}\.([1-9]|1[0-2])\.([1-9]|[12][0-9]|3[01])(\.[1-9][0-9]*)?(-[0-9A-Za-z.]+)?$'; then
            echo "::error::$GITHUB_REF_NAME is not a release name such as 2026.11.19 or 2026.11.19.1, without leading zeros."
            exit 1
          fi

      - name: Make the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A version with a suffix, such as 2026.11.19-rc.1, is a pre-release.
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes $prerelease

      - name: Move stable to the release
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          # Fast-forward only: a release older than what stable has is refused
          # rather than rolled back. Roll back by hand: see CONTRIBUTING.md.
          git push origin "${GITHUB_SHA}:refs/heads/stable"
